name: Stage account migration

on:
  push:
    branches: [chore/cloudflare-account-migration]

permissions:
  contents: read

concurrency:
  group: stage-account-migration
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prepare route-free migration build
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = 415516b7403708741d606f6930e89e3f
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          const parsed = ts.parseConfigFileTextToJson('wrangler.jsonc', fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (parsed.error) throw new Error('Cannot parse Wrangler configuration');
          const config = parsed.config;
          config.routes = [];
          config.main = path.resolve(config.main);
          for (const container of config.containers) {
            for (const image of Object.values(container.images)) {
              image.dockerfile = path.resolve(image.dockerfile);
              image.build_context = process.cwd();
            }
          }
          fs.mkdirSync('.wrangler', { recursive: true });
          fs.writeFileSync('.wrangler/migration-stage.json', JSON.stringify(config));
          fs.writeFileSync('.wrangler/migration-stage.vite.config.ts', `
          import path from 'node:path';
          import { cloudflare } from '@cloudflare/vite-plugin';
          import tailwindcss from '@tailwindcss/vite';
          import react from '@vitejs/plugin-react';
          import { defineConfig } from 'vite';
          export default defineConfig({
            plugins: [tailwindcss(), react(), cloudflare({ configPath: '.wrangler/migration-stage.json' })],
            resolve: { alias: { '@': path.resolve('./src/client') } },
          });
          `);
          JS
      - run: bunx vite build --config .wrangler/migration-stage.vite.config.ts
      - name: Stage Worker and containers
        run: bunx wrangler deploy --config dist/hello_sandbox/wrangler.json --no-bundle --message "Stage account migration from GitHub Actions"
